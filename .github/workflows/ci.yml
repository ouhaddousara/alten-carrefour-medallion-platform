name: dbt CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  dbt-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/503680028075/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "data-platform-sa@black-octagon-502709-e2.iam.gserviceaccount.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt
        run: pip install dbt-core==1.11.7 dbt-bigquery==1.12.0

      - name: Generate CI profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << 'PROFILE'
          medallion_platform:
            target: ci
            outputs:
              ci:
                type: bigquery
                method: oauth
                project: black-octagon-502709-e2
                dataset: ci_validation
                threads: 4
                location: EU
          PROFILE

      - name: Install dbt packages
        run: dbt deps

      - name: Compile dbt models (syntax check)
        run: dbt compile

      - name: Run models empty (validate SQL against BigQuery, no real data)
        run: dbt run --empty

      - name: Run dbt tests
        run: dbt test
